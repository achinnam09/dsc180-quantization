[project]
name = "dsc180-quantization"
version = "0.1.0"
description = "Synthetic experiments comparing per-channel and per-token KV-cache quantization."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
